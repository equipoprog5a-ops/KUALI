{id:'sample3',author:'Equipo KUALI',time:'Contenido de ejemplo',category:'Cursos',title:'Comparte lo que sabes y sigue aprendiendo',text:'Los cursos y talleres son oportunidades para intercambiar experiencias, reforzar habilidades y conocer a otras personas interesadas en la formación técnica.',likes:2,comments:[]}
];
function posts(){const saved=data.posts||[];return [...saved,...samplePosts.filter(p=>!saved.some(s=>s.id===p.id))].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){toast('No se pudo guardar','El almacenamiento del navegador está lleno o deshabilitado.')}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name='Usuario'){return name.trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'KU'}
function formatDate(s){if(!s)return 'Sin fecha';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}
function formatDateLong(s){if(!s)return '';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})}
function getService(id){return services.find(s=>s.id===id)||services[0]}
function getStatus(s){if(s==='En proceso')return 'progress';if(s==='Completada')return 'done';if(s==='Cancelada')return 'cancelled';return 'pending'}
function statusBadge(s){return `<span class="status-pill ${getStatus(s)}"><span>•</span>${esc(s||'Pendiente')}</span>`}
function toast(title,message=''){const wrap=$('#toastWrap');const el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('check-circle',19)}<div><strong>${esc(title)}</strong><p>${esc(message)}</p></div>`;wrap.append(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(5px)';setTimeout(()=>el.remove(),200)},3900)}
function unread(){return (data.notifications||[]).filter(n=>!n.read).length}
function addNotification(title,text){data.notifications.unshift({id:'n'+Date.now()+Math.random().toString(16).slice(2),title,text,time:Date.now(),read:false});data.notifications=data.notifications.slice(0,30);persist();updateHeader()}
function updateHeader(){const name=data.profile.name||activeUser?.user_metadata?.full_name||activeUser?.email?.split('@')[0]||'Visitante';$('#topUserName').textContent=name;$('#topUserRole').textContent=activeUser?'Cuenta conectada':'Iniciar sesión';$('#topAvatar').textContent=initials(name);$('#notifDot').style.display=unread()?'block':'none';$('#requestCount').textContent=data.requests.filter(r=>!['Completada','Cancelada'].includes(r.status)).length;$('#modeLabel').textContent=supabaseConfigured?'Prototipo · datos de esta versión':'Versión de prueba · datos guardados en este navegador'}
function setTitle(kicker,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${esc(kicker)}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function sectionHead(title,desc='',action=''){return `<div class="section-heading"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}
function serviceCard(s,compact=false){const fav=data.favorites.includes(s.id);return `<article class="card service-card"><div class="service-top"><div class="service-icon ${s.tone}">${icon(s.icon,22)}</div><button class="favorite-btn ${fav?'saved':''}" data-action="favorite" data-id="${s.id}" aria-label="${fav?'Quitar de':'Agregar a'} favoritos">${icon('heart',16)}</button></div><div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p></div><div class="service-footer"><span class="tag">${esc(s.category)}</span><button class="btn btn-secondary btn-small" data-action="request" data-id="${s.id}">Solicitar ${icon('arrow-right',13)}</button></div></article>`}
function requestListRow(r){const s=getService(r.serviceId);return `<div class="request-row"><div class="request-symbol">${icon(s.icon,18)}</div><div class="request-info"><strong>${esc(r.title||s.name)}</strong><small>${esc(r.code||'KUA-'+String(r.id).slice(-5))} · ${formatDate(r.createdDate||new Date().toISOString().slice(0,10))}</small></div><div class="request-end">${statusBadge(r.status)}</div></div>`}
function emptyState(title,desc,action='',ico='clipboard'){return `<div class="empty-state"><div class="empty-ico">${icon(ico,24)}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p>${action}</div>`}
function renderHome(){const active=data.requests.filter(r=>!['Completada','Cancelada'].includes(r.status)).length;const upcomingEnroll=courses.filter(c=>data.enrollments.includes(c.id)).length;const fav=data.favorites.length;return `${setTitle('Tu espacio KUALI','¡Hola, '+esc((data.profile.name||'Visitante').trim().split(/\s+/)[0])+'!','Consulta tu actividad reciente y descubre servicios, cursos y oportunidades para participar.',`<button class="btn btn-secondary" data-action="notifications">${icon('bell',15)} Notificaciones</button>`)}
<div class="welcome-banner"><div class="welcome-copy"><div class="welcome-badge">${icon('sparkles',13)} BIENESTAR COMUNITARIO</div><h2>Tu comunidad,<br><span>más conectada.</span></h2><p>Encuentra servicios, aprende nuevas habilidades y participa en actividades que nos ayudan a crecer juntos.</p><div class="welcome-actions"><button class="btn btn-primary" data-action="request">${icon('plus',15)} Solicitar un servicio</button><button class="btn btn-glass" data-view="community">Explorar comunidad ${icon('arrow-right',14)}</button></div></div><div class="welcome-illustration"><div class="welcome-orbit"></div><img src="assets/kuali-mockup.jpeg" alt="Vista previa de KUALI"></div></div>
<div class="stat-grid"><div class="card stat-card"><div class="stat-icon blue">${icon('clipboard',21)}</div><div><small>Solicitudes activas</small><strong>${active}</strong><em>Servicios por atender</em></div></div><div class="card stat-card"><div class="stat-icon orange">${icon('heart',21)}</div><div><small>Mis favoritos</small><strong>${fav}</strong><em>Servicios guardados</em></div></div><div class="card stat-card"><div class="stat-icon green">${icon('graduation',21)}</div><div><small>Cursos inscritos</small><strong>${upcomingEnroll}</strong><em>Aprendizaje continuo</em></div></div><div class="card stat-card"><div class="stat-icon yellow">${icon('calendar',21)}</div><div><small>Eventos próximos</small><strong>${events.filter(e=>new Date(e.date+'T23:59:00')>=new Date()).length}</strong><em>Actividades publicadas</em></div></div></div>
<div class="home-grid"><div><div class="section-heading"><div><h2>Servicios populares</h2><p>¿En qué podemos ayudarte?</p></div><button class="link-btn" data-view="services">Ver todos →</button></div><div class="service-grid">${services.slice(0,4).map(s=>serviceCard(s,true)).join('')}</div><div style="height:22px"></div><div class="card card-pad">${sectionHead('Mis solicitudes','Consulta su estado y los detalles.','<button class="link-btn" data-view="requests">Ver todas →</button>')}${data.requests.length?`<div class="row-list">${data.requests.slice(0,3).map(requestListRow).join('')}</div>`:emptyState('Aún no tienes solicitudes','Cuando solicites un servicio podrás seguir su estado aquí.','<button class="btn btn-primary btn-small" data-action="request">Solicitar un servicio</button>')}</div></div><div><div class="card card-pad">${sectionHead('Próximos eventos','Actividades para aprender y colaborar.','<button class="link-btn" data-view="events">Ver calendario →</button>')}${events.slice(0,2).map(eventMini).join('')}</div><div style="height:16px"></div><div class="card card-pad">${sectionHead('Recomendado para ti','Descubre oportunidades de aprendizaje.','<button class="link-btn" data-view="courses">Ver cursos →</button>')}${courses.slice(0,2).map(courseMini).join('')}</div><div style="height:16px"></div><div class="notice-strip"><strong>Consejo KUALI:</strong> comparte detalles claros al solicitar un servicio. Para trabajos eléctricos o de refrigeración, recurre a personal capacitado.</div></div></div>`}
function eventMini(e){return `<div class="event-card" style="padding:12px 0;border-top:1px solid #f0f2f7;border-radius:0"><div class="date-block"><strong>${new Date(e.date+'T12:00:00').getDate()}</strong><small>${new Date(e.date+'T12:00:00').toLocaleDateString('es-MX',{month:'short'})}</small></div><div class="event-copy"><h3>${esc(e.title)}</h3><p>${esc(e.place)}</p><button class="link-btn" data-action="event-detail" data-id="${e.id}">Ver detalles →</button></div></div>`}
function courseMini(c){return `<div class="request-row"><div class="request-symbol" style="background:${c.tone==='orange-bg'?'var(--orange-soft)':'var(--blue-soft)'}">${icon(c.icon,17)}</div><div class="request-info"><strong>${esc(c.title)}</strong><small>${formatDate(c.date)} · ${esc(c.duration)}</small></div><button class="btn btn-secondary btn-small" data-view="courses">Ver</button></div>`}
function renderServices(){const cats=['Todos',...new Set(services.map(s=>s.category))];const results=services.filter(s=>(serviceCategory==='Todos'||s.category===serviceCategory)&&(s.name+' '+s.description+' '+s.category).toLowerCase().includes(serviceQuery.toLowerCase()));return `${setTitle('Explorar','Servicios para tu hogar y comunidad','Explora opciones de mantenimiento, orientación técnica y actividades comunitarias. La disponibilidad debe confirmarse antes de contratar.',`<button class="btn btn-primary" data-action="request">${icon('plus',15)} Nueva solicitud</button>`)}<div class="toolbar"><label class="top-search" style="width:min(350px,100%)"><span style="position:absolute;left:12px;top:11px;color:#8c98ad">${icon('search',16)}</span><input id="serviceSearch" type="search" placeholder="Buscar un servicio..." value="${esc(serviceQuery)}" style="padding-left:36px"></label><select class="filter-select" id="serviceCategory" aria-label="Filtrar por categoría">${cats.map(c=>`<option ${c===serviceCategory?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="fine-print">${results.length} servicio(s)</span></div><div class="service-grid" id="serviceGrid">${results.map(s=>serviceCard(s)).join('')||emptyState('No encontramos resultados','Prueba otra palabra o selecciona otra categoría.','','search')}</div><div style="height:20px"></div><div class="notice-strip"><strong>Antes de solicitar:</strong> escribe qué necesitas, añade una zona de referencia y evita publicar datos sensibles. Los costos y tiempos finales deben confirmarse con el proveedor.</div>`}
function renderRequests(){const filtered=data.requests.filter(r=>requestTab==='Todas'||(requestTab==='Activas'&&!['Completada','Cancelada'].includes(r.status))||(requestTab===r.status));return `${setTitle('Seguimiento','Mis solicitudes','Revisa los datos y el estado de las solicitudes registradas desde este navegador.',`<button class="btn btn-primary" data-action="request">${icon('plus',15)} Solicitar servicio</button>`)}<div class="segmented">${['Todas','Activas','Pendiente','En proceso','Completada','Cancelada'].map(t=>`<button class="${requestTab===t?'active':''}" data-action="request-tab" data-tab="${t}">${t}</button>`).join('')}</div>${filtered.length?filtered.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(r=>{const s=getService(r.serviceId);return `<article class="card request-card"><div class="request-card-head"><div><h3>${esc(r.title||s.name)}</h3><p>${esc(r.code||'KUA-'+String(r.id).slice(-5))} · Creada el ${formatDate(r.createdDate)}</p></div>${statusBadge(r.status)}</div><div class="request-meta"><span>${icon('map-pin',13)}${esc(r.zone||'Zona no indicada')}</span><span>${icon('calendar',13)}${r.preferredDate?formatDate(r.preferredDate):'Fecha por acordar'}</span><span>${icon('clock',13)}${esc(r.urgency||'Normal')}</span></div><p>${esc(r.description||'Sin descripción adicional')}</p><div class="request-card-foot"><span class="fine-print">${esc(s.category)} · Actualizado ${formatDate(r.updatedDate||r.createdDate)}</span><div>${r.status==='Pendiente'?`<button class="btn btn-danger btn-small" data-action="cancel-request" data-id="${r.id}">Cancelar solicitud</button>`:''}<button class="btn btn-secondary btn-small" data-action="request-detail" data-id="${r.id}">Ver detalles</button></div></div></article>`}).join(''):emptyState('No hay solicitudes en esta sección',requestTab==='Todas'?'Cuando crees una solicitud aparecerá aquí.':'Prueba otra pestaña o crea una nueva solicitud.','<button class="btn btn-primary btn-small" data-action="request">Crear solicitud</button>')}`}
function renderCommunity(){const feed=posts();return `${setTitle('Conectar','Comunidad KUALI','Comparte consejos, preguntas y actividades en un espacio de respeto y colaboración.',`<button class="btn btn-primary" data-action="compose">${icon('plus',15)} Crear publicación</button>`)}<div class="feed-layout"><div><div class="card composer"><span class="avatar">${initials(data.profile.name)}</span><button class="composer-trigger" data-action="compose">¿Qué te gustaría compartir con la comunidad?</button><button class="icon-btn" data-action="compose" aria-label="Crear publicación">${icon('edit',17)}</button></div><div id="feed">${feed.map(p=>postCard(p)).join('')}</div></div><aside><div class="card card-pad">${sectionHead('Normas de convivencia','Para mantener una comunidad útil y segura.')}${['Trata a todas las personas con respeto.','No publiques datos privados, contraseñas ni direcciones ajenas.','Comparte consejos responsables y evita información engañosa.','Para servicios técnicos, recomienda personal capacitado.'].map((t,i)=>`<div class="activity-item" style="margin:13px 0"><div class="activity-dot">${icon(i===0?'heart':i===1?'shield':i===2?'check-circle':'wrench',15)}</div><div><strong>${['Respeto mutuo','Cuida tu privacidad','Información útil','Seguridad primero'][i]}</strong><p>${esc(t)}</p></div></div>`).join('')}</div><div style="height:15px"></div><div class="card card-pad">${sectionHead('Temas para explorar')}${['Consejos','Cursos','Avisos','Experiencias'].map(t=>`<button class="btn btn-secondary btn-small" style="margin:4px" data-action="post-filter" data-category="${t}"># ${t}</button>`).join('')}<p class="fine-print" style="margin-top:10px">Las publicaciones marcadas como ejemplo son contenido ilustrativo y no representan usuarios reales.</p></div></aside></div>`}
function postCard(p){const liked=data.likes.includes(p.id);const comments=data.comments.filter(c=>c.postId===p.id);const totalComments=(p.comments?.length||0)+comments.length;return `<article class="card post-card"><div class="post-head"><div class="post-avatar">${initials(p.author)}</div><div class="post-author"><strong>${esc(p.author)}</strong><small>${esc(p.time||'Ahora')} ${p.id.startsWith('sample')?'<span class="post-label">Ejemplo</span>':''}</small></div><span class="post-label">${esc(p.category||'Comunidad')}</span></div>${p.title?`<h3>${esc(p.title)}</h3>`:''}<p>${esc(p.text)}</p><div class="post-actions"><button class="post-action ${liked?'liked':''}" data-action="like" data-id="${p.id}">${icon('heart',15)} ${Number(p.likes||0)+(liked?1:0)} Me gusta</button><button class="post-action" data-action="comment" data-id="${p.id}">${icon('message',15)} ${totalComments} Comentarios</button>${!p.id.startsWith('sample')?`<button class="post-action" style="margin-left:auto" data-action="delete-post" data-id="${p.id}">${icon('x',14)} Eliminar</button>`:''}</div>${comments.map(c=>`<div class="post-comment"><strong>${esc(c.author)}:</strong> ${esc(c.text)}</div>`).join('')}${(p.comments||[]).map(c=>`<div class="post-comment"><strong>${esc(c.author||'Comunidad')}:</strong> ${esc(c.text||c)}</div>`).join('')}</article>`}
function renderCourses(){const results=courses.filter(c=>(courseFilter==='Todos'||c.category===courseFilter)&&(c.title+' '+c.description+' '+c.category).toLowerCase().includes(courseQuery.toLowerCase()));return `${setTitle('Aprender','Cursos y capacitación','Explora contenidos de formación técnica y desarrollo personal. Verifica las fechas y la disponibilidad antes de participar.',`<button class="btn btn-secondary" data-view="events">${icon('calendar',15)} Ver eventos</button>`)}<div class="toolbar"><label class="top-search" style="width:min(350px,100%)"><span style="position:absolute;left:12px;top:11px;color:#8c98ad">${icon('search',16)}</span><input id="courseSearch" type="search" value="${esc(courseQuery)}" placeholder="Buscar cursos..." style="padding-left:36px"></label><select id="courseCategory" class="filter-select">${['Todos','Técnico','Emprendimiento','Seguridad'].map(c=>`<option ${c===courseFilter?'selected':''}>${c}</option>`).join('')}</select><span class="fine-print" id="courseResultsCount">${results.length} curso(s)</span></div><div class="service-grid" id="courseGrid">${results.map(c=>{const enrolled=data.enrollments.includes(c.id);return `<article class="card course-card"><div class="course-cover ${c.tone}"><strong>${esc(c.title)}</strong></div><div class="course-content"><span class="tag">${esc(c.category)}</span><h3 style="margin-top:9px">${esc(c.title)}</h3><p>${esc(c.description)}</p><div class="course-meta"><span>${icon('calendar',13)}${formatDate(c.date)}</span><span>${icon('clock',13)}${esc(c.duration)} · Nivel ${esc(c.level)}</span><span>${icon('users',13)}Cupo ilustrativo: ${c.seats} personas</span></div><div class="course-footer"><button class="favorite-btn ${data.favorites.includes(c.id)?'saved':''}" data-action="favorite" data-id="${c.id}" aria-label="Guardar curso">${icon('heart',15)}</button><button class="btn ${enrolled?'btn-secondary':'btn-primary'} btn-small" data-action="enroll" data-id="${c.id}">${enrolled?'Interés guardado ✓':'Registrar interés'}</button></div></div></article>`}).join('')||emptyState('No hay cursos que coincidan','Cambia tu búsqueda o categoría.','','search')}</div><div class="card card-pad" id="courseNoResults" hidden style="margin-top:14px">${emptyState('No hay cursos que coincidan','Prueba otra palabra o categoría.','','search')}</div><p class="fine-print" style="margin-top:16px">Las fechas y los cupos mostrados son ilustrativos. Deben confirmarse antes de publicar la app a usuarios reales.</p>`}
function renderEvents(){return `${setTitle('Participación','Eventos de la comunidad','Descubre actividades comunitarias y guarda tu interés para dar seguimiento.',`<button class="btn btn-secondary" data-view="courses">${icon('book',15)} Explorar cursos</button>`)}<div class="notice-strip" style="margin-bottom:17px"><strong>Calendario de muestra:</strong> las fechas, sedes y cupos de esta versión son demostrativos. Confírmalos antes de realizar una actividad real.</div><div class="event-list">${events.map(e=>{const d=new Date(e.date+'T12:00:00');const going=data.rsvps.includes(e.id);return `<article class="card event-card"><div class="date-block"><strong>${d.getDate()}</strong><small>${d.toLocaleDateString('es-MX',{month:'short'})}</small></div><div class="event-copy"><span class="tag">${esc(e.category)}</span><h3 style="margin-top:7px">${esc(e.title)}</h3><p>${esc(e.description)}</p><div class="event-meta"><span>${icon('clock',13)}${esc(e.time)} h</span><span>${icon('map-pin',13)}${esc(e.place)}</span></div><button class="btn ${going?'btn-secondary':'btn-primary'} btn-small" data-action="rsvp" data-id="${e.id}">${going?'Asistencia guardada ✓':'Me interesa asistir'}</button></div></article>`}).join('')}</div>`}
function renderPoints(){const allPoints=[...(data.provider?[{id:'local-provider',name:data.provider.name,role:data.provider.specialty+' · Perfil propio',zone:data.provider.zone,hours:data.provider.availability,phone:data.provider.phone,note:'Perfil guardado solo en este navegador; aún no aparece a otros usuarios.'}]:[]),...points];return `${setTitle('Directorio','Puntos de servicio','Consulta los puntos informativos y perfiles incluidos en esta versión. La información aún requiere verificación.',`<button class="btn btn-primary" data-view="provider">${icon('plus',15)} Ofrecer mis servicios</button>`)}<div class="notice-strip" style="margin-bottom:17px"><strong>Directorio de demostración:</strong> los perfiles y datos de ubicación que aparecen aquí no son negocios verificados. Añade información real y autorizada antes de publicar esta sección.</div><div class="points-grid">${allPoints.map(p=>`<article class="card point-card"><div class="point-head"><div class="point-avatar">${icon('map-pin',21)}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.role)}</p></div></div><span class="tag">${p.id==='local-provider'?'Mi perfil · local':'Perfil ilustrativo'}</span><div class="point-info"><span>${icon('map-pin',14)}${esc(p.zone)}</span><span>${icon('clock',14)}${esc(p.hours)}</span>${p.phone?`<span>${icon('phone',14)}${esc(p.phone)}</span>`:''}<span>${icon('info',14)}${esc(p.note||'Directorio demostrativo; verifica los datos antes de contactar.')}</span></div><div class="point-actions"><button class="btn btn-secondary btn-small" data-action="point-save" data-id="${p.id}">${data.favorites.includes(p.id)?'Guardado ✓':'Guardar favorito'}</button><button class="btn btn-primary btn-small" data-action="point-contact" data-id="${p.id}">Consultar</button></div></article>`).join('')}</div>`}
function renderFavorites(){const favServices=services.filter(s=>data.favorites.includes(s.id));const favCourses=courses.filter(c=>data.favorites.includes(c.id));const favPoints=points.filter(p=>data.favorites.includes(p.id));return `${setTitle('Guardados','Mis favoritos','Accede rápidamente a los servicios y cursos que te interesan.')}<div class="section-heading"><div><h2>Servicios guardados</h2><p>${favServices.length} elemento(s)</p></div></div><div class="service-grid">${favServices.map(s=>serviceCard(s)).join('')||emptyState('Aún no tienes favoritos','Usa el corazón de cualquier servicio para guardarlo.','<button class="btn btn-primary btn-small" data-view="services">Explorar servicios</button>','heart')}</div><div style="height:24px"></div><div class="section-heading"><div><h2>Cursos guardados</h2><p>${favCourses.length} elemento(s)</p></div></div><div class="service-grid">${favCourses.map(c=>`<article class="card course-card"><div class="course-content"><span class="tag">${esc(c.category)}</span><h3 style="margin-top:9px">${esc(c.title)}</h3><p>${esc(c.description)}</p><button class="btn btn-primary btn-small" data-view="courses">Ver curso ${icon('arrow-right',13)}</button></div></article>`).join('')||emptyState('No has guardado cursos','Guarda un curso con el botón del corazón en la sección Cursos.','','heart')}</div><div style="height:24px"></div><div class="section-heading"><div><h2>Puntos guardados</h2></div></div><div class="points-grid">${favPoints.map(p=>`<div class="card point-card"><h3>${esc(p.name)}</h3><p class="muted">${esc(p.zone)}</p><button class="btn btn-secondary btn-small" data-action="point-save" data-id="${p.id}">Quitar de favoritos</button></div>`).join('')||emptyState('Sin puntos guardados','Guarda directorios útiles para tenerlos a mano.','','heart')}</div>`}
function renderProfile(){const p=data.profile;return `${setTitle('Personalización','Mi perfil','Mantén tu información actualizada para facilitar la comunicación.')}<div class="profile-layout"><aside class="card profile-summary"><div class="profile-big-avatar">${initials(p.name)}</div><h2>${esc(p.name||'Visitante')}</h2><p>${esc(p.email||'Sin correo vinculado')}</p><div class="profile-kpis"><div><strong>${data.requests.length}</strong><small>Solicitudes</small></div><div><strong>${data.enrollments.length}</strong><small>Cursos</small></div></div><div class="divider" style="grid-column:1/-1"></div><button class="btn btn-secondary" style="width:100%;grid-column:1/-1" data-action="account">${icon('shield',15)} Cuenta y acceso</button></aside><section class="card card-pad"><div class="section-heading"><div><h2>Información personal</h2><p>Los campos son opcionales en modo de demostración.</p></div></div><form id="profileForm"><div class="form-grid"><div class="field"><label for="profileName">Nombre para mostrar</label><input id="profileName" name="name" maxlength="70" value="${esc(p.name)}" required></div><div class="field"><label for="profileEmail">Correo electrónico</label><input id="profileEmail" name="email" type="email" value="${esc(activeUser?.email||p.email)}" ${activeUser?'readonly':''} placeholder="tucorreo@ejemplo.com"></div><div class="field"><label for="profilePhone">Teléfono (opcional)</label><input id="profilePhone" name="phone" type="tel" maxlength="25" value="${esc(p.phone)}" placeholder="Tu teléfono de contacto"></div><div class="field"><label for="profileZone">Colonia o zona general</label><input id="profileZone" name="zone" maxlength="100" value="${esc(p.zone)}" placeholder="Ej. zona centro"></div><div class="field full"><label for="profileAbout">Sobre mí</label><textarea id="profileAbout" name="about" maxlength="400" placeholder="Cuenta brevemente tus intereses o habilidades">${esc(p.about)}</textarea></div><div class="field full"><label>Intereses</label><div style="display:flex;gap:8px;flex-wrap:wrap">${['Refrigeración','Mantenimiento','Cursos técnicos','Voluntariado','Emprendimiento'].map(i=>`<label class="tag" style="cursor:pointer"><input type="checkbox" name="interest" value="${i}" ${p.interests.includes(i)?'checked':''}> ${i}</label>`).join('')}</div></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="profile-reset">Restablecer</button><button type="submit" class="btn btn-primary">Guardar cambios</button></div></form><div class="divider"></div><div class="notice-strip"><strong>Privacidad:</strong> no compartas contraseñas ni publiques direcciones exactas. En esta versión, los cambios del perfil se guardan en el navegador actual.</div></section></div>`}
function renderProvider(){const p=data.provider;return `${setTitle('Compartir habilidades','Ofrecer mis servicios','Registra tus conocimientos y disponibilidad. En esta versión, el perfil solo queda guardado en este navegador.',`<button class="btn btn-secondary" data-view="points">${icon('map-pin',15)} Ver directorio</button>`)}${p?`<div class="notice-strip" style="margin-bottom:16px"><strong>Tu perfil está guardado:</strong> por ahora solo se almacena en este navegador; todavía no se publica a otros usuarios.</div><div class="card card-pad" style="margin-bottom:17px"><div class="point-head"><div class="point-avatar">${icon('wrench',21)}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.specialty)} · ${esc(p.zone)}</p></div><span class="tag orange" style="margin-left:auto">Perfil local</span></div><p class="muted" style="font-size:12px">${esc(p.about)}</p><div class="request-meta"><span>${icon('phone',13)}${esc(p.phone)}</span><span>${icon('clock',13)}${esc(p.availability)}</span><span>${icon('star',13)}${p.experience||'0'} años de experiencia</span></div><button class="btn btn-danger btn-small" data-action="provider-deactivate">Eliminar mi perfil</button></div>`:''}<div class="profile-layout"><aside class="card card-pad"><div class="service-icon orange" style="margin-bottom:14px">${icon('users',22)}</div><h2 style="font:800 18px Manrope,sans-serif;color:var(--navy);margin:0 0 8px">Tu conocimiento puede ayudar</h2><p class="muted" style="font-size:12px">Un perfil claro facilita que otras personas sepan qué sabes hacer, en qué zona trabajas y cuándo pueden contactarte.</p><div class="divider"></div><div class="activity-list"><div class="activity-item"><div class="activity-dot">${icon('check-circle',15)}</div><div><strong>Describe tus habilidades</strong><p>Indica los trabajos que puedes realizar.</p></div></div><div class="activity-item"><div class="activity-dot">${icon('map-pin',15)}</div><div><strong>Usa una zona general</strong><p>No es necesario mostrar tu dirección exacta.</p></div></div><div class="activity-item"><div class="activity-dot">${icon('shield',15)}</div><div><strong>Trabaja con seguridad</strong><p>No anuncies trabajos para los que no estés capacitado.</p></div></div></div></aside><section class="card card-pad"><div class="section-heading"><div><h2>${p?'Editar perfil de servicio':'Crear perfil de servicio'}</h2><p>Todos los datos se guardan localmente en esta versión.</p></div></div><form id="providerForm"><div class="form-grid"><div class="field"><label for="providerName">Nombre para mostrar *</label><input id="providerName" maxlength="70" value="${esc(p?.name||(data.profile.name==='Visitante'?'':data.profile.name))}" required></div><div class="field"><label for="providerSpecialty">Especialidad principal *</label><select id="providerSpecialty" required>${['Refrigeración','Climatización','Mantenimiento general','Electricidad (capacitado)','Capacitación técnica','Asesoría técnica','Voluntariado comunitario'].map(x=>`<option ${p?.specialty===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="providerPhone">Medio de contacto *</label><input id="providerPhone" maxlength="70" value="${esc(p?.phone||data.profile.phone)}" placeholder="Teléfono o correo" required></div><div class="field"><label for="providerZone">Zona general *</label><input id="providerZone" maxlength="100" value="${esc(p?.zone||data.profile.zone)}" placeholder="Colonia o comunidad" required></div><div class="field"><label for="providerExperience">Años de experiencia</label><input id="providerExperience" type="number" min="0" max="80" value="${esc(p?.experience||'0')}"></div><div class="field"><label for="providerAvailability">Disponibilidad</label><select id="providerAvailability">${['Entre semana','Fines de semana','Por cita','Tiempo parcial','Voluntariado'].map(x=>`<option ${p?.availability===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label for="providerAbout">Servicios y habilidades que ofreces *</label><textarea id="providerAbout" maxlength="700" minlength="8" required placeholder="Describe tus habilidades, los trabajos que puedes realizar y cualquier límite importante...">${esc(p?.about||'')}</textarea></div><div class="field full"><label style="display:flex;gap:9px;align-items:flex-start;font-weight:500"><input type="checkbox" id="providerConsent" ${p?'checked':''} required> Acepto que estos datos de contacto se utilicen en mi perfil de servicio cuando la plataforma tenga publicación pública.</label></div></div><div class="notice-strip" style="margin-top:14px"><strong>Transparencia:</strong> guardar este perfil no crea un anuncio público ni garantiza que otros usuarios lo vean. Para ello hace falta conectar Supabase y aplicar los permisos adecuados.</div><div class="form-actions"><button type="button" class="btn btn-secondary" data-view="points">Cancelar</button><button type="submit" class="btn btn-primary">${p?'Guardar cambios':'Guardar mi perfil'}</button></div></form></section></div>`}
function renderHelp(){return `${setTitle('Centro de ayuda','¿Cómo podemos ayudarte?','Consulta respuestas frecuentes y guarda comentarios para mejorar KUALI. Los comentarios aún no se envían a un equipo de soporte.')}<div class="help-grid"><section class="card card-pad">${sectionHead('Preguntas frecuentes','Respuestas para comenzar.')}${[['¿Qué es KUALI?','KUALI reúne opciones de servicios, formación y participación comunitaria en una sola interfaz.'],['¿Cómo solicito un servicio?','Abre Servicios, elige una opción y pulsa Nueva solicitud. Describe tu necesidad e indica una zona general de referencia. El registro actual es local y no contacta automáticamente a un proveedor.'],['¿Puedo seguir mi solicitud?','Sí. En Mis solicitudes puedes consultar los datos y el estado de cada registro. Actualmente, la información se guarda solo en este navegador y no se envía a un técnico.'],['¿Mis datos se comparten con otras personas?','Todavía no. Esta versión guarda datos en este navegador. Para compartirlos entre usuarios, KUALI debe conectarse a una base de datos con reglas de seguridad.'],['¿Cómo registro mi interés en un curso?','Entra a Cursos y pulsa Registrar interés. La selección se guarda en este navegador y no confirma una plaza ni una inscripción con un organizador.'],['¿Qué pasa si olvido mi contraseña?','La recuperación de contraseña debe habilitarse y probarse en Supabase antes de ofrecer el acceso a usuarios reales.']].map((x,i)=>`<details class="faq-item" ${i===0?'open':''}><summary>${esc(x[0])}${icon('chevron-down',15)}</summary><p>${esc(x[1])}</p></details>`).join('')}</section><section class="card card-pad">${sectionHead('Enviar comentarios','Ayúdanos a mejorar la plataforma.') }<form id="feedbackForm"><div class="field"><label for="feedbackTopic">Tema</label><select id="feedbackTopic" name="topic"><option>Idea de mejora</option><option>Problema técnico</option><option>Servicio</option><option>Curso o evento</option><option>Otro</option></select></div><div class="field" style="margin-top:13px"><label for="feedbackText">Describe tu comentario</label><textarea id="feedbackText" name="text" minlength="8" maxlength="1200" required placeholder="Cuéntanos cómo podemos mejorar..."></textarea></div><div class="field" style="margin-top:13px"><label for="feedbackContact">Correo de contacto (opcional)</label><input id="feedbackContact" name="email" type="email" placeholder="tucorreo@ejemplo.com"></div><div class="form-actions"><button class="btn btn-primary" type="submit">${icon('send',14)} Guardar comentario</button></div></form><div class="divider"></div><div class="notice-strip"><strong>Estado del proyecto:</strong> algunas funciones son demostrativas. No se ha habilitado aún un canal real de atención ni un directorio verificado.</div></section></div><div style="height:18px"></div><div class="card card-pad">${sectionHead('Buenas prácticas','Antes de publicar KUALI para toda la comunidad.') }<div class="activity-list">${['Verificar las identidades de quienes ofrecen servicios.','Validar horarios, precios y ubicaciones antes de anunciarlos.','Configurar autenticación, permisos y reglas de acceso de la base de datos.','Publicar aviso de privacidad y condiciones de uso.'].map(t=>`<div class="activity-item"><div class="activity-dot">${icon('shield',15)}</div><div><strong>${esc(t)}</strong></div></div>`).join('')}</div></div>`}
function renderMore(){return `${setTitle('Navegación','Más opciones','Elige una sección de KUALI para continuar.')}<div class="service-grid">${[['events','Eventos','calendar','Consulta actividades y talleres.'],['provider','Ofrecer servicios','wrench','Crea un perfil para compartir tus habilidades.'],['points','Puntos de servicio','map-pin','Revisa el directorio comunitario.'],['favorites','Mis favoritos','heart','Accede a tus elementos guardados.'],['profile','Mi perfil','user','Actualiza tus datos.'],['help','Ayuda y soporte','help','Encuentra respuestas y envía comentarios.']].map(a=>`<button class="card service-card" style="text-align:left;cursor:pointer" data-view="${a[0]}"><div class="service-top"><div class="service-icon">${icon(a[2],22)}</div>${icon('arrow-right',16)}</div><h3>${esc(a[1])}</h3><p>${esc(a[3])}</p></button>`).join('')}</div>`}
function renderView(view=currentView){currentView=view;const main=$('#mainContent');const renderers={home:renderHome,services:renderServices,requests:renderRequests,community:renderCommunity,courses:renderCourses,events:renderEvents,points:renderPoints,favorites:renderFavorites,provider:renderProvider,profile:renderProfile,help:renderHelp,more:renderMore};main.innerHTML=(renderers[view]||renderHome)();$$('[data-view]').forEach(el=>{el.classList.toggle('active',el.dataset.view===view)});$$('.mobile-nav button').forEach(el=>el.classList.toggle('active',el.dataset.view===view||(view==='events'||view==='points'||view==='favorites'||view==='profile'||view==='help')&&el.dataset.view==='more'));updateHeader();main.focus({preventScroll:true});}
function showView(view){if(view==='more'){renderView('more')}else{renderView(view)}window.scrollTo({top:0,behavior:'smooth'})}
function openModal(title,subtitle,html,wide=false){modalFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalSubtitle').textContent=subtitle||'';$('#modalBody').innerHTML=html;$('#modal').classList.toggle('wide',wide);$('#modalBackdrop').hidden=false;document.body.style.overflow='hidden';$('#modalClose').focus()}
function closeModal(){$('#modalBackdrop').hidden=true;document.body.style.overflow='';if(modalFocus&&modalFocus.focus)modalFocus.focus();activeModalMode=''}
$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalBackdrop').hidden)closeModal()});
function requestModal(serviceId){const s=serviceId?getService(serviceId):null;activeModalMode='request';openModal('Solicitar un servicio','Completa los datos para registrar tu solicitud.',`<form id="requestForm"><div class="form-grid"><div class="field full"><label for="reqService">Servicio que necesitas *</label><select id="reqService" required>${services.filter(s=>!['Cursos','Comunidad'].includes(s.category)).map(v=>`<option value="${v.id}" ${s?.id===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div><div class="field"><label for="reqName">Nombre de contacto *</label><input id="reqName" maxlength="70" value="${esc(data.profile.name==='Visitante'?'':data.profile.name)}" placeholder="Tu nombre" required></div><div class="field"><label for="reqPhone">Teléfono o medio de contacto *</label><input id="reqPhone" maxlength="40" value="${esc(data.profile.phone)}" placeholder="Teléfono o correo" required></div><div class="field"><label for="reqZone">Zona general *</label><input id="reqZone" maxlength="100" value="${esc(data.profile.zone)}" placeholder="Colonia o zona" required></div><div class="field"><label for="reqDate">Fecha preferida (opcional)</label><input id="reqDate" type="date" min="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label for="reqUrgency">Prioridad</label><select id="reqUrgency"><option>Normal</option><option>Puede esperar</option><option>Urgente (evaluar)</option></select></div><div class="field full"><label for="reqDescription">Describe el problema o necesidad *</label><textarea id="reqDescription" minlength="8" maxlength="1200" required placeholder="Ej. Mi minisplit enciende, pero no enfría desde ayer..."></textarea></div><div class="field full"><label style="display:flex;gap:9px;align-items:flex-start;font-weight:500"><input type="checkbox" id="reqConsent" required style="margin-top:3px;width:auto;min-height:auto"> Confirmo que puedo compartir estos datos de contacto para dar seguimiento a esta solicitud.</label></div></div><div class="notice-strip" style="margin-top:14px"><strong>Importante:</strong> esta versión registra tu solicitud en este navegador; todavía no la envía a un técnico real.</div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancelar</button><button type="submit" class="btn btn-primary">${icon('send',14)} Registrar solicitud</button></div></form>`,true)}
function showRequestDetail(id){const r=data.requests.find(r=>String(r.id)===String(id));if(!r)return;const s=getService(r.serviceId);openModal('Detalle de solicitud',r.code||'KUALI',`<div class="request-card-head"><div><h3>${esc(r.title||s.name)}</h3><p>Creada el ${formatDate(r.createdDate)}</p></div>${statusBadge(r.status)}</div><div class="divider"></div><div class="activity-list"><div class="activity-item"><div class="activity-dot">${icon(s.icon,15)}</div><div><strong>Servicio solicitado</strong><p>${esc(s.name)} · ${esc(s.category)}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('map-pin',15)}</div><div><strong>Zona general</strong><p>${esc(r.zone)}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('phone',15)}</div><div><strong>Contacto</strong><p>${esc(r.phone)}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('calendar',15)}</div><div><strong>Fecha preferida</strong><p>${r.preferredDate?formatDate(r.preferredDate):'Por acordar'}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('message',15)}</div><div><strong>Descripción</strong><p>${esc(r.description)}</p></div></div></div><div class="divider"></div><div class="notice-strip">Estado actual: <strong>${esc(r.status)}</strong>. En una versión conectada, el proveedor actualizaría este estado desde su cuenta autorizada.</div><div class="form-actions"><button class="btn btn-secondary" data-action="close-modal">Cerrar</button>${r.status==='Pendiente'?`<button class="btn btn-danger" data-action="cancel-request" data-id="${r.id}">Cancelar solicitud</button>`:''}</div>`)}
function courseDetail(id){const c=courses.find(c=>c.id===id);if(!c)return;openModal(c.title,'Información del curso',`<div class="course-cover ${c.tone}" style="height:120px;border-radius:14px;margin-bottom:17px"><strong>${esc(c.title)}</strong></div><span class="tag">${esc(c.category)}</span><p style="color:var(--muted);font-size:12px">${esc(c.description)}</p><div class="activity-list" style="margin:16px 0"><div class="activity-item"><div class="activity-dot">${icon('calendar',15)}</div><div><strong>Fecha</strong><p>${formatDate(c.date)}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('clock',15)}</div><div><strong>Duración</strong><p>${esc(c.duration)}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('graduation',15)}</div><div><strong>Nivel</strong><p>${esc(c.level)}</p></div></div></div><div class="notice-strip">La fecha, el cupo, la sede y la disponibilidad son datos de muestra. Registrar interés no confirma una inscripción real.</div><div class="form-actions"><button class="btn btn-secondary" data-action="close-modal">Cerrar</button><button class="btn btn-primary" data-action="enroll" data-id="${c.id}">${data.enrollments.includes(c.id)?'Quitar interés':'Registrar interés'}</button></div>`)}
function postComposer(){openModal('Crear publicación','Comparte un consejo, una pregunta o una actividad con la comunidad.',`<form id="postForm"><div class="field"><label for="postCategory">Categoría</label><select id="postCategory"><option>Consejo</option><option>Pregunta</option><option>Aviso</option><option>Cursos</option><option>Experiencia</option></select></div><div class="field" style="margin-top:13px"><label for="postTitle">Título (opcional)</label><input id="postTitle" maxlength="120" placeholder="¿De qué quieres hablar?"></div><div class="field" style="margin-top:13px"><label for="postText">Mensaje *</label><textarea id="postText" minlength="8" maxlength="1200" required placeholder="Escribe tu publicación..."></textarea></div><div class="notice-strip" style="margin-top:13px">No publiques contraseñas, direcciones exactas, teléfonos de otras personas ni información privada.</div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Publicar</button></div></form>`)}
function commentComposer(id){pendingCommentPost=id;const p=posts().find(p=>p.id===id);openModal('Comentarios',p?.title||'Conversación de la comunidad',`<div>${(p?.comments||[]).map(c=>`<div class="post-comment"><strong>${esc(c.author||'Comunidad')}:</strong> ${esc(c.text||c)}</div>`).join('')}${data.comments.filter(c=>c.postId===id).map(c=>`<div class="post-comment"><strong>${esc(c.author)}:</strong> ${esc(c.text)}</div>`).join('')}</div><form id="commentForm" style="margin-top:17px"><div class="field"><label for="commentText">Añadir un comentario</label><textarea id="commentText" minlength="2" maxlength="500" required placeholder="Escribe un comentario respetuoso..."></textarea></div><div class="form-actions"><button class="btn btn-secondary" type="button" data-action="close-modal">Cerrar</button><button class="btn btn-primary" type="submit">Comentar</button></div></form>`)}
function authModal(mode='login'){activeModalMode='auth';if(activeUser){openModal('Mi cuenta KUALI','Información de la cuenta conectada.',`<div class="profile-summary" style="padding:16px;text-align:center"><div class="profile-big-avatar">${initials(activeUser.user_metadata?.full_name||activeUser.email||'KU')}</div><h2>${esc(activeUser.user_metadata?.full_name||activeUser.email?.split('@')[0]||'Usuario KUALI')}</h2><p>${esc(activeUser.email||'')}</p><span class="tag green">Autenticación conectada</span></div><div class="password-note">Las solicitudes, publicaciones, cursos y favoritos de esta versión todavía se guardan en este navegador; aún no se sincronizan con una base de datos compartida.</div><div class="form-actions"><button class="btn btn-secondary" data-action="close-modal">Cerrar</button><button class="btn btn-danger" data-action="logout">${icon('logout',14)} Cerrar sesión</button></div>`);return}openModal(mode==='register'?'Crear cuenta KUALI':'Acceder a KUALI','Conecta tu cuenta para una experiencia personalizada.',`<div class="segmented" style="width:100%"><button class="${mode==='login'?'active':''}" data-action="auth-tab" data-tab="login" style="flex:1">Iniciar sesión</button><button class="${mode==='register'?'active':''}" data-action="auth-tab" data-tab="register" style="flex:1">Crear cuenta</button></div><form id="authForm"><div class="field ${mode==='login'?'hidden':''}" id="authNameField" style="margin-bottom:12px"><label for="authName">Nombre completo</label><input id="authName" maxlength="70" placeholder="Tu nombre" ${mode==='register'?'required':''}></div><div class="field"><label for="authEmail">Correo electrónico</label><input id="authEmail" type="email" autocomplete="email" required placeholder="tucorreo@ejemplo.com"></div><div class="field" style="margin-top:12px"><label for="authPassword">Contraseña</label><input id="authPassword" type="password" minlength="8" autocomplete="${mode==='login'?'current-password':'new-password'}" required placeholder="Mínimo 8 caracteres"></div><button class="btn btn-primary" style="width:100%;margin-top:16px" type="submit">${mode==='login'?'Iniciar sesión':'Crear cuenta'}</button></form><div class="password-note">${supabaseConfigured?'La autenticación usa tu proyecto Supabase. Los datos de solicitudes, publicaciones y registros aún se guardan localmente en este prototipo.':'La autenticación real aún no está configurada. Puedes probar la aplicación como visitante; no guardamos contraseñas de demostración.'}</div><button class="btn btn-secondary" style="width:100%;margin-top:13px" data-action="guest">Continuar como visitante</button><p id="authMsg" class="fine-print" style="margin-top:11px" role="status"></p>`)}
function showNotifications(){data.notifications.forEach(n=>n.read=true);persist();updateHeader();openModal('Notificaciones','Avisos y actividad de tu espacio KUALI.',`${data.notifications.length?data.notifications.map(n=>`<div class="request-row"><div class="request-symbol">${icon('bell',16)}</div><div class="request-info"><strong>${esc(n.title)}</strong><small>${esc(n.text)} · ${new Date(n.time).toLocaleDateString('es-MX')}</small></div></div>`).join(''):emptyState('Sin notificaciones','Aquí aparecerán los avisos importantes.','','bell')}<div class="form-actions"><button class="btn btn-secondary" data-action="close-modal">Cerrar</button></div>`)}
async function handleAction(action,id,el){switch(action){case 'request':requestModal(id);break;case 'favorite':{if(!requireAccount())break;(async()=>{const exists=data.favorites.includes(id);const q=exists?supabaseClient.from('favorites').delete().eq('user_id',activeUser.id).eq('item_type','service').eq('item_id',String(id)):supabaseClient.from('favorites').insert({user_id:activeUser.id,item_type:'service',item_id:String(id)});const {error}=await q;if(error){dbError(error,'No se pudo actualizar favoritos');return}if(exists)data.favorites=data.favorites.filter(x=>x!==id);else data.favorites.push(id);persist();toast(exists?'Quitado de favoritos':'Agregado a favoritos');renderView(currentView)})();break}case 'request-tab':requestTab=el.dataset.tab;renderView('requests');break;case 'cancel-request':{const r=data.requests.find(r=>String(r.id)===String(id));if(r&&r.status==='Pendiente'){r.status='Cancelada';r.updatedDate=new Date().toISOString().slice(0,10);if(supabaseClient&&activeUser){const {error}=await supabaseClient.from('service_requests').update({status:'Cancelada'}).eq('id',r.id).eq('user_id',activeUser.id);if(error){r.status='Pendiente';dbError(error,'No se pudo cancelar la solicitud');break}}persist();addNotification('Solicitud cancelada',r.title||'Tu solicitud fue cancelada.');closeModal();renderView('requests');toast('Solicitud cancelada','Se actualizó el estado en este navegador.')}else toast('No se puede cancelar','Solo las solicitudes pendientes se pueden cancelar.');break}case 'request-detail':showRequestDetail(id);break;case 'compose':postComposer();break;case 'like':{if(!requireAccount())break;(async()=>{const liked=data.likes.includes(id);const q=liked?supabaseClient.from('post_likes').delete().eq('post_id',id).eq('user_id',activeUser.id):supabaseClient.from('post_likes').insert({post_id:id,user_id:activeUser.id});const {error}=await q;if(error){dbError(error,'No se pudo actualizar la reacción');return}if(liked)data.likes=data.likes.filter(x=>x!==id);else data.likes.push(id);persist();renderView('community')})();break}case 'comment':commentComposer(id);break;case 'delete-post':if(confirm('¿Quieres eliminar esta publicación?')){if(!requireAccount())break;const {error}=await supabaseClient.from('community_posts').delete().eq('id',id).eq('user_id',activeUser.id);if(error){dbError(error,'No se pudo eliminar la publicación');break}data.posts=data.posts.filter(p=>p.id!==id);data.likes=data.likes.filter(x=>x!==id);data.comments=data.comments.filter(c=>c.postId!==id);persist();renderView('community');toast('Publicación eliminada')}break;case 'post-filter':renderView('community');setTimeout(()=>{const feed=$('#feed');if(feed){const aliases={Consejos:"Consejo",Avisos:"Aviso",Experiencias:"Experiencia"};const list=posts().filter(p=>p.category===(aliases[el.dataset.category]||el.dataset.category));feed.innerHTML=list.length?list.map(postCard).join(''):emptyState('No hay publicaciones de este tema','Puedes publicar la primera.','<button class="btn btn-primary btn-small" data-action="compose">Crear publicación</button>','message')}},0);break;case 'enroll':{if(!requireAccount())break;const exists=data.enrollments.includes(id);const q=exists?supabaseClient.from('course_enrollments').delete().eq('course_id',String(id)).eq('user_id',activeUser.id):supabaseClient.from('course_enrollments').insert({course_id:String(id),user_id:activeUser.id});const {error}=await q;if(error){dbError(error,'No se pudo actualizar tu inscripción');break}if(exists)data.enrollments=data.enrollments.filter(x=>x!==id);else{data.enrollments.push(id);addNotification('Interés guardado','Tu interés en el curso quedó registrado.')}persist();closeModal();renderView(currentView);toast(exists?'Interés eliminado':'Interés guardado','Tu selección se actualizó en KUALI; no confirma una plaza.');break}case 'rsvp':{if(!requireAccount())break;const exists=data.rsvps.includes(id);const q=exists?supabaseClient.from('event_rsvps').delete().eq('event_id',String(id)).eq('user_id',activeUser.id):supabaseClient.from('event_rsvps').insert({event_id:String(id),user_id:activeUser.id});const {error}=await q;if(error){dbError(error,'No se pudo actualizar tu participación');break}if(exists)data.rsvps=data.rsvps.filter(x=>x!==id);else{data.rsvps.push(id);addNotification('Interés registrado','Tu interés en el evento quedó registrado.')}persist();closeModal();renderView('events');toast(exists?'Registro eliminado':'Interés registrado');break}case 'event-detail':{const e=events.find(x=>x.id===id);if(e)openModal(e.title,'Información del evento',`<p style="color:var(--muted);font-size:12px">${esc(e.description)}</p><div class="activity-list" style="margin-top:15px"><div class="activity-item"><div class="activity-dot">${icon('calendar',15)}</div><div><strong>Fecha y hora</strong><p>${formatDate(e.date)} · ${e.time} h</p></div></div><div class="activity-item"><div class="activity-dot">${icon('map-pin',15)}</div><div><strong>Sede</strong><p>${esc(e.place)}</p></div></div></div><div class="notice-strip" style="margin-top:15px">Actividad ilustrativa; confirma la sede y fecha antes de asistir.</div><div class="form-actions"><button class="btn btn-secondary" data-action="close-modal">Cerrar</button><button class="btn btn-primary" data-action="rsvp" data-id="${id}">${data.rsvps.includes(id)?'Quitar interés':'Me interesa'}</button></div>`);break}case 'provider-deactivate':if(confirm('¿Eliminar tu perfil local de servicios?')){data.provider=null;persist();renderView('provider');toast('Perfil eliminado','Se quitó el perfil de este navegador.')}break;case 'point-save':{if(data.favorites.includes(id))data.favorites=data.favorites.filter(x=>x!==id);else data.favorites.push(id);persist();renderView(currentView);toast(data.favorites.includes(id)?'Guardado en favoritos':'Quitado de favoritos');break}case 'point-contact':{const p=[...(data.provider?[{id:'local-provider',name:data.provider.name,role:data.provider.specialty+' · Perfil propio',zone:data.provider.zone,hours:data.provider.availability,phone:data.provider.phone,note:'Este perfil solo está guardado en tu navegador; todavía no se publica a otros usuarios.'}]:[]),...points].find(x=>x.id===id);if(p)openModal(p.name,'Información del directorio',`<div class="activity-list"><div class="activity-item"><div class="activity-dot">${icon('info',15)}</div><div><strong>Tipo de perfil</strong><p>${esc(p.role||'Información comunitaria')}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('map-pin',15)}</div><div><strong>Zona</strong><p>${esc(p.zone||'Por confirmar')}</p></div></div><div class="activity-item"><div class="activity-dot">${icon('clock',15)}</div><div><strong>Horario o disponibilidad</strong><p>${esc(p.hours||'Por confirmar')}</p></div></div>${p.phone?`<div class="activity-item"><div class="activity-dot">${icon('phone',15)}</div><div><strong>Contacto</strong><p>${esc(p.phone)}</p></div></div>`:''}</div><div class="notice-strip" style="margin-top:15px">${esc(p.note||'Información por verificar antes de usar el directorio.')}</div><div class="form-actions"><button class="btn btn-secondary" data-action="close-modal">Cerrar</button></div>`);break}case 'notifications':showNotifications();break;case 'account':authModal('login');break;case 'logout':if(supabaseClient){supabaseClient.auth.signOut().then(({error})=>{if(error)throw error;activeUser=null;userIsGuest=true;closeModal();updateHeader();toast('Sesión cerrada','Has salido de tu cuenta KUALI.')}).catch(err=>toast('No se pudo cerrar sesión',err.message||'Inténtalo de nuevo.'))}else{activeUser=null;userIsGuest=true;closeModal();updateHeader();toast('Sesión cerrada','Estás navegando como visitante.')}break;case 'auth-tab':closeModal();authModal(el.dataset.tab);break;case 'guest':closeModal();userIsGuest=true;toast('Modo visitante','Puedes explorar y probar las funciones de KUALI.');updateHeader();break;case 'profile-reset':renderView('profile');break;case 'close-modal':closeModal();break;case 'theme':toggleTheme();break}}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){e.preventDefault();showView(view.dataset.view);return}const actionEl=e.target.closest('[data-action]');if(actionEl){e.preventDefault();handleAction(actionEl.dataset.action,actionEl.dataset.id,actionEl);return}});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){serviceQuery=e.target.value.trim();serviceCategory='Todos';courseFilter='Todos';renderView('services');$('#serviceSearch')?.focus()}});
$('#globalSearch').addEventListener('input',e=>{if(!e.target.value.trim())return;if(currentView==='services'){serviceQuery=e.target.value;const s=$('#serviceSearch');if(s)s.value=serviceQuery;updateServiceGrid()} });
function updateServiceGrid(){const grid=$('#serviceGrid');if(!grid)return;const results=services.filter(s=>(serviceCategory==='Todos'||s.category===serviceCategory)&&(s.name+' '+s.description+' '+s.category).toLowerCase().includes(serviceQuery.toLowerCase()));grid.innerHTML=results.map(s=>serviceCard(s)).join('')||emptyState('No encontramos resultados','Prueba con otra búsqueda.','','search')}
document.addEventListener('input',e=>{if(e.target.id==='serviceSearch'){serviceQuery=e.target.value;$('#globalSearch').value=serviceQuery;updateServiceGrid()}if(e.target.id==='courseSearch'){courseQuery=e.target.value;const cursor=e.target.selectionStart??courseQuery.length;renderView('courses');const input=$('#courseSearch');if(input){input.focus();input.setSelectionRange(cursor,cursor)}}});
document.addEventListener('change',e=>{if(e.target.id==='serviceCategory'){serviceCategory=e.target.value;updateServiceGrid()}if(e.target.id==='courseCategory'){courseFilter=e.target.value;renderView('courses')} });
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(form.id==='requestForm'){if(!$('#reqName').value.trim()||!$('#reqPhone').value.trim()||!$('#reqZone').value.trim()||$('#reqDescription').value.trim().length<8){toast('Revisa el formulario','Completa los datos obligatorios y describe la necesidad con al menos 8 caracteres.');return}const sid=$('#reqService').value;const r={id:Date.now(),code:'KUA-'+Math.random().toString(36).slice(2,7).toUpperCase(),serviceId:sid,title:getService(sid).name,name:$('#reqName').value.trim(),phone:$('#reqPhone').value.trim(),zone:$('#reqZone').value.trim(),preferredDate:$('#reqDate').value,urgency:$('#reqUrgency').value,description:$('#reqDescription').value.trim(),status:'Pendiente',createdAt:Date.now(),createdDate:new Date().toISOString().slice(0,10),updatedDate:new Date().toISOString().slice(0,10)};if(!requireAccount())return;const {data:savedRequest,error:requestError}=await supabaseClient.from('service_requests').insert({user_id:activeUser.id,code:r.code,service_id:r.serviceId,service_name:r.title,contact_name:r.name,contact_value:r.phone,zone:r.zone,preferred_date:r.preferredDate||null,urgency:r.urgency,description:r.description}).select().single();if(requestError){dbError(requestError,'No se pudo registrar la solicitud');return}r.id=savedRequest.id;data.requests.unshift(r);if(!data.profile.phone)data.profile.phone=r.phone;if(!data.profile.zone)data.profile.zone=r.zone;try{await saveRemoteProfile()}catch(e){dbError(e,'La solicitud se guardó, pero el perfil no se actualizó')}persist();addNotification('Solicitud registrada',r.title+' · '+r.code);closeModal();renderView('requests');toast('Solicitud registrada','Tu solicitud quedó guardada en KUALI.');return}if(form.id==='postForm'){if($('#postText').value.trim().length<8){toast('Mensaje incompleto','Escribe un mensaje de al menos 8 caracteres.');return}const post={id:'post-'+Date.now(),author:data.profile.name||'Visitante',time:'Ahora',category:$('#postCategory').value,title:$('#postTitle').value.trim(),text:$('#postText').value.trim(),likes:0,comments:[],createdAt:Date.now()};if(!requireAccount())return;const {data:savedPost,error:postError}=await supabaseClient.from('community_posts').insert({user_id:activeUser.id,category:post.category,title:post.title||null,body:post.text}).select().single();if(postError){dbError(postError,'No se pudo publicar el mensaje');return}post.id=savedPost.id;post.userId=activeUser.id;data.posts.unshift(post);persist();addNotification('Publicación creada','Tu mensaje ya está disponible en la comunidad.');closeModal();renderView('community');toast('Publicación creada','Tu publicación se guardó en KUALI.');return}if(form.id==='commentForm'){const text=$('#commentText').value.trim();if(text.length<2){toast('Comentario incompleto','Escribe al menos 2 caracteres.');return}if(text){if(!requireAccount())return;const {data:savedComment,error:commentError}=await supabaseClient.from('post_comments').insert({post_id:pendingCommentPost,user_id:activeUser.id,body:text}).select().single();if(commentError){dbError(commentError,'No se pudo guardar el comentario');return}data.comments.push({id:savedComment.id,postId:pendingCommentPost,author:data.profile.name||'Miembro KUALI',text,createdAt:Date.now()});persist();closeModal();renderView('community');toast('Comentario añadido','Tu comentario ya está disponible.');}return}if(form.id==='profileForm'){const fd=new FormData(form);data.profile={...data.profile,name:String(fd.get('name')||'Visitante').trim(),email:activeUser?.email||String(fd.get('email')||'').trim(),phone:String(fd.get('phone')||'').trim(),zone:String(fd.get('zone')||'').trim(),about:String(fd.get('about')||'').trim(),interests:fd.getAll('interest')};if(!requireAccount())return;try{await saveRemoteProfile()}catch(error){dbError(error,'No se pudo actualizar tu perfil');return}persist();updateHeader();renderView('profile');toast('Perfil actualizado','Tu perfil se guardó en KUALI.');return}if(form.id==='providerForm'){const experience=Math.max(0,Math.min(80,Number($('#providerExperience').value||0)));if(!requireAccount())return;const providerPayload={id:activeUser.id,display_name:$('#providerName').value.trim(),specialty:$('#providerSpecialty').value,contact_value:$('#providerPhone').value.trim(),zone:$('#providerZone').value.trim(),years_experience:experience,availability:$('#providerAvailability').value,description:$('#providerAbout').value.trim(),verified:false,published:false};const {error:providerError}=await supabaseClient.from('provider_profiles').upsert(providerPayload);if(providerError){dbError(providerError,'No se pudo guardar el perfil de proveedor');return}data.provider={id:activeUser.id,name:providerPayload.display_name,specialty:providerPayload.specialty,phone:providerPayload.contact_value,zone:providerPayload.zone,experience,availability:providerPayload.availability,about:providerPayload.description};if(data.profile.name==='Visitante'&&data.provider.name)data.profile.name=data.provider.name;if(!data.profile.phone)data.profile.phone=data.provider.phone;if(!data.profile.zone)data.profile.zone=data.provider.zone;try{await saveRemoteProfile()}catch(e){console.warn(e)}persist();addNotification('Perfil de servicio guardado','Tu perfil quedó guardado como borrador para revisión.');renderView('provider');toast('Perfil guardado','Tu perfil está guardado y aún no aparece en el directorio público.');return}if(form.id==='feedbackForm'){if($('#feedbackText').value.trim().length<8){toast('Comentario incompleto','Escribe al menos 8 caracteres.');return}const feedbackPayload={user_id:activeUser?.id||null,topic:$('#feedbackTopic').value,body:$('#feedbackText').value.trim(),contact_email:$('#feedbackContact').value.trim()||null};const {error:feedbackError}=await supabaseClient.from('feedback').insert(feedbackPayload);if(feedbackError){dbError(feedbackError,'No se pudo enviar tu comentario');return}data.feedback.unshift({id:Date.now(),topic:feedbackPayload.topic,text:feedbackPayload.body,email:feedbackPayload.contact_email,createdAt:Date.now()});persist();form.reset();toast('Gracias por tus comentarios','Tu comentario fue enviado a KUALI.');return}if(form.id==='authForm'){const email=$('#authEmail').value.trim().toLowerCase();const password=$('#authPassword').value;const name=$('#authName')?.value.trim()||'';const register=$('#authNameField')&&!$('#authNameField').classList.contains('hidden');const msg=$('#authMsg');if(!supabaseClient){msg.textContent='Aún falta conectar el proyecto Supabase. No se creó una cuenta real; puedes continuar como visitante.';msg.style.color='var(--red)';return}try{if(register){const {data:result,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:window.location.href.split('#')[0]}});if(error)throw error;if(result.session&&result.user){activeUser=result.user;data.profile.name=name||email.split('@')[0];data.profile.email=email;persist();updateHeader();closeModal();toast('Cuenta creada','Ya puedes usar tu cuenta de KUALI.')}else{msg.textContent='Cuenta registrada. Revisa tu correo para confirmar la dirección y después inicia sesión.';msg.style.color='var(--green)'}}else{const {data:result,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;activeUser=result.user;userIsGuest=false;data.profile.email=email;data.profile.name=result.user.user_metadata?.full_name||(data.profile.name==='Visitante'?email.split('@')[0]:data.profile.name)||email.split('@')[0];persist();updateHeader();closeModal();toast('Sesión iniciada','Bienvenido a KUALI.')} }catch(err){msg.textContent=err.message||'No se pudo completar el acceso.';msg.style.color='var(--red)'}return}});
function toggleTheme(){data.dark=!data.dark;document.body.classList.toggle('dark',data.dark);persist();$('#themeToggle').innerHTML=icon(data.dark?'sun':'moon',18);toast(data.dark?'Modo oscuro activado':'Modo claro activado')}
$('#themeToggle').addEventListener('click',toggleTheme);$('#notificationsBtn').addEventListener('click',showNotifications);$('#accountBtn').addEventListener('click',()=>authModal(activeUser?'login':'login'));
function initializeSupabaseAuth(){if(!supabaseClient)return;supabaseClient.auth.onAuthStateChange((_event,session)=>{activeUser=session?.user||null;userIsGuest=!activeUser;if(activeUser){data.profile.email=activeUser.email||'';data.profile.name=activeUser.user_metadata?.full_name||(data.profile.name==='Visitante'?activeUser.email?.split('@')[0]:data.profile.name)||activeUser.email?.split('@')[0];persist();setTimeout(()=>loadRemoteData(),0)}else{remoteDataLoaded=false}updateHeader()});supabaseClient.auth.getSession().then(async ({data:result})=>{activeUser=result.session?.user||null;userIsGuest=!activeUser;if(activeUser){data.profile.email=activeUser.email||'';data.profile.name=activeUser.user_metadata?.full_name||(data.profile.name==='Visitante'?activeUser.email?.split('@')[0]:data.profile.name)||activeUser.email?.split('@')[0];await loadRemoteData()}updateHeader();renderView(currentView)})}
if(supabaseClient){initializeSupabaseAuth()}else if(supabaseConfigured){const sdk=document.createElement('script');sdk.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sdk.onload=()=>{try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);initializeSupabaseAuth()}catch(error){toast('No se pudo conectar Supabase','Revisa la URL y la Publishable key.')}};sdk.onerror=()=>toast('No se pudo cargar Supabase','Comprueba la conexión a internet y vuelve a intentarlo.');document.head.appendChild(sdk)}
if(data.dark)document.body.classList.add('dark');$('#themeToggle').innerHTML=icon(data.dark?'sun':'moon',18);updateHeader();renderView('home');
</script>
